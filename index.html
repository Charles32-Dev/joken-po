<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>

<body class="wrapper">

    <main>
        <h1>JokenPô</h1>
        <div class="button">
            <img src="assets/mao-fechada.png" alt="" onclick="PlayerHuman('rock')" id="rock">
            <img src="assets/mao-aberta.png" alt="" onclick="PlayerHuman('paper')" id="paper">
            <img src="assets/tesoura.png" alt="" onclick="PlayerHuman('scissors')" id="scissors">
        </div>
        <div class="container">
            <p class="result"></p>

            <p class="your-score">Sua Pontuação: <span id="your-score">0</span></p>
            <p class="machine-score">Pontuação da Alexa: <span id="machine-score">0</span></p>
            <img onclick="Reload()" class="reload-container" src="assets/reload.png" title="Reiniciar o Jogo"
                alt="Reiniciar">
        </div>
    </main>
    <footer>
        <p>Desenv: <span>Charles Alexandre</span><a href="https://rodolfomori.com.br/devclub-comercial/"> ©[DevClub]</a>
        </p>
    </footer>

</body>
<script src="script.js"></script>

</html
